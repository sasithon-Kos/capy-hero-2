// Web Audio sounds are synthesized in the browser; no external MP3 downloads needed.
let audioCtx=null, soundOn=true;
function unlockAudio(){
 if(!soundOn)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 }catch(err){console.warn('Audio unavailable',err)}
}
function tone(freq,duration=0.10,delay=0,type='sine',volume=0.12,endFreq){
 if(!soundOn||!audioCtx||audioCtx.state!=='running')return;
 try{
  const t=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,t);
  if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),t+duration);
  gain.gain.setValueAtTime(0.0001,t);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0002,volume),t+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+duration);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start(t);osc.stop(t+duration+0.02);
 }catch(err){console.warn('Sound failed',err)}
}
function sfx(name){
 switch(name){
  case 'coin':tone(880,.065,0,'sine',.09);tone(1320,.12,.065,'sine',.1);break;
  case 'jump':tone(290,.16,0,'triangle',.10,650);break;
  case 'hit':tone(260,.24,0,'sawtooth',.08,80);break;
  case 'death':tone(460,.19,0,'triangle',.13,270);tone(300,.24,.2,'triangle',.12,125);tone(175,.32,.45,'triangle',.1,75);break;
  case 'stomp':tone(400,.1,0,'square',.05,170);break;
  case 'wrong':tone(180,.15,0,'triangle',.11);tone(135,.2,.15,'triangle',.1);break;
  case 'correct':tone(520,.10);tone(660,.10,.11);tone(880,.19,.23);break;
  case 'level':tone(523,.13);tone(659,.13,.14);tone(784,.13,.28);tone(1047,.3,.43);break;
  case 'checkpoint':tone(523,.10);tone(784,.17,.12);break;
  case 'power':tone(392,.10);tone(784,.20,.10);break;
  case 'double':tone(340,.09);tone(730,.16,.08);break;
  case 'dash':tone(180,.21,0,'sawtooth',.065,780);break;
  case 'combo':tone(950,.09);tone(1380,.14,.09);break;
  case 'finish':for(let i=0;i<8;i++)tone([523,659,784,1047,784,880,1047,1318][i],.17,i*.13,'triangle',.11);break;
 }
}
// Safari on iPhone requires a real user gesture before starting audio.
document.addEventListener('pointerdown',unlockAudio,{passive:true});

 if(soundOn){unlockAudio();sfx('correct')}
});

 const province=$('provinceField').value.trim(),school=$('schoolField').value.trim(),name=$('nicknameField').value.trim();
 if(!province){alert('กรุณาเลือกจังหวัดก่อนเริ่มเกม');$('provinceField').focus();return}
 if(school.length<5){alert('กรุณากรอกชื่อสถานศึกษาให้ครบ (อย่างน้อย 5 ตัวอักษร)');$('schoolField').focus();return}
 playerProfile={nickname:name,school,province};
 difficulty='challenge';
 newGame();
}
function createBonuses(){
 bonusItems=[{x:690,y:270,type:'magnet',taken:false},{x:1380,y:270,type:'boost',taken:false},{x:1780,y:310,type:'shield',taken:false}];
}
function collectBonus(b){
 b.taken=true;bonusCount++;score+=30;
 if(b.type==='magnet'){for(const c of coins){if(!c.taken&&Math.abs(c.x-player.x)<210){c.taken=true;score+=10}}}
 if(b.type==='boost'){dashCooldown=0;shieldCharge=Math.min(3,shieldCharge+1)}
 if(b.type==='shield'){shieldCharge=Math.min(3,shieldCharge+2)}
 sfx('power');setHUD();renderExtra();
}
// คะแนนมาตรฐาน 1,000: ผ่านด่าน 6×120=720 + คะแนนสะสม (ไม่เกิน 2,800) /10 =280
function capyScore1000(levelsDone, rawScore){
 return Math.max(0,Math.min(1000, Math.round(Math.max(0,Math.min(6,levelsDone))*120 + Math.max(0,Math.min(2800,rawScore))/10)));
}

function dash(){if(locked||!player||dashFrames>0||dashCooldown>0)return;dashFrames=12;dashCooldown=65;dashDir=keys.left?-1:keys.right?1:dashDir;player.vy=Math.min(player.vy,0);player.inv=Math.max(player.inv,12);sfx('dash')}
const checkpointPos=970; // stable ground just before the mid-level obstacle
function safeCheckpoint(){let x=checkpointPos;while(!onGround(x)||!onGround(x+45))x-=20;return Math.max(60,x)}
const keys={left:false,right:false};
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
function button(txt,fn,cls='btn'){const b=el('button',txt,cls);b.type='button';b.addEventListener('click',fn);return b}
function clearPanel(){panel.replaceChildren();overlay.classList.remove('hidden')}
function setHUD(){$('levelText').textContent=`${levels[li].icon} ด่าน ${li+1}/6: ${levels[li].name}${cpActive?' • ✓ จุดพัก':''}`;$('lifeText').textContent='❤️'.repeat(Math.max(0,lives));$('scoreText').textContent=`🪙 ${score} คะแนน • 🔥 ${coinCombo} • 🛡️ ${shieldCharge}`;$('skill').textContent=shieldTime>0?'🛡️ เปิดอยู่':`🛡️ ${shieldCharge}`}
function onGround(x){return x>=0&&x<WORLD&&!designs[li].gaps.some(g=>x>=g[0]&&x<g[1])}
function prepareLevel(){
 player={x:60,y:FLOOR-46,w:46,h:46,vx:0,vy:0,ground:false,inv:0,jumps:0};
 camera=0;frame=0;locked=false;finished=false;cpX=60;cpActive=false;shieldCharge=0;shieldTime=0;sparkles=[];dashFrames=0;dashCooldown=0;coinCombo=0;lastCoinFrame=-999;
 const d=designs[li];coins=[];levelStarted=elapsed();createBonuses();
 for(let x=170;x<WORLD-95;x+=115){if(onGround(x))coins.push({x,y:FLOOR-70-(x%3)*8,taken:false})}
 for(const p of d.platforms)coins.push({x:p[0]+p[2]/2,y:p[1]-30,taken:false});
 // Real moving platforms added near existing gaps. They move vertically and can carry the player.
 movePlatforms=li===0?[{x:475,y:350,base:350,w:100,h:16,phase:0,lastY:350},{x:1193,y:326,base:326,w:92,h:16,phase:1.6,lastY:326}]:[{x:designs[li].gaps[0][0]+15,y:345,base:345,w:90,h:16,phase:0,lastY:345}];
 enemies=(difficulty==='challenge'?[300,670,760,1280,1620,1740]:[300,760,1280,1740]).filter(x=>onGround(x)).map((x,i)=>({x,y:FLOOR-34,w:36,h:34,origin:x,dir:i%2?1:-1,alive:true}));
 overlay.classList.add('hidden');setHUD()
}
function newGame(){unlockAudio();li=0;score=0;lives=difficulty==='challenge'?3:4;runStarted=performance.now();runId=newRunId();finalSubmitted=false;finalStatus='';practiceContinue=false;continueUsed=0;bonusCount=0;playerAnswers={social:0,culture:0};keys.left=false;keys.right=false;prepareLevel()}
function startScreen(){clearPanel();panel.append(el('p','🐹 CAPY HERO 2.0 — CHALLENGE','eyebrow'),el('h2','พร้อมลุย 6 ด่านไหม?'),el('p','ภาพฉากสบายตาขึ้น ศัตรูไวขึ้น มีโบนัสเวลา โล่ Dash และไอเท็มพิเศษ'));panel.append(makeProfileForm());panel.append(button('🎮 เริ่มเกม',beginWithProfile,'btn primary'));panel.append(el('p','กด Space สองครั้งเพื่อกระโดดสองชั้น • Z พุ่ง • X ใช้โล่ • ทุกด่านเพิ่มความท้าทาย','muted'))}
function jump(){
 if(locked||!player||player.jumps>=2)return;
 const isSecond=player.jumps===1;
 player.vy=isSecond?JUMP*.83:JUMP;
 player.jumps++;player.ground=false;
 sfx(isSecond?'double':'jump');
 if(isSecond)for(let i=0;i<12;i++)sparkles.push({x:player.x+23,y:player.y+44,vx:(Math.random()-.5)*5,vy:Math.random()*3,life:22});
}
function useShield(){if(locked||shieldCharge<=0||shieldTime>0)return;shieldCharge--;shieldTime=180;sfx('power');setHUD()}
function respawn(){player.x=cpX;player.y=FLOOR-135;player.vy=0;player.jumps=0;player.inv=105}

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hurt(){if(player.inv>0||locked)return;if(shieldTime>0){shieldTime=0;player.inv=45;sfx('power');return}lives--;sfx(lives<=0?'death':'hit');setHUD();if(lives<=0){locked=true;endScreen(false);return}respawn()}
function update(dt){if(locked)return;frame+=dt;
 player.inv=Math.max(0,player.inv-dt);shieldTime=Math.max(0,shieldTime-dt);dashCooldown=Math.max(0,dashCooldown-dt);dashFrames=Math.max(0,dashFrames-dt);
 if(!cpActive&&player.x>safeCheckpoint()){cpX=safeCheckpoint();cpActive=true;shieldCharge=Math.min(2,shieldCharge+1);sfx('checkpoint');setHUD()}
 for(const p of movePlatforms){p.lastY=p.y;p.y=p.base+Math.sin(frame*.035+p.phase)*37}
 const oldBottom=player.y+player.h;
 player.vx=dashFrames>0?dashDir*13.8:(Number(keys.right)-Number(keys.left))*MOVE;
 if(keys.left&&!keys.right)dashDir=-1;else if(keys.right&&!keys.left)dashDir=1;
 player.x=Math.max(0,Math.min(WORLD-player.w,player.x+player.vx*dt));
 player.vy=Math.min(15,player.vy+GRAV*dt);player.y+=player.vy*dt;player.ground=false;
 if(player.vy>=0){const bottom=player.y+player.h;if(oldBottom<=FLOOR+4&&bottom>=FLOOR&&(onGround(player.x+9)||onGround(player.x+player.w-9))){player.y=FLOOR-player.h;player.vy=0;player.ground=true;player.jumps=0}for(const p of designs[li].platforms){if(oldBottom<=p[1]+5&&bottom>=p[1]&&player.x+player.w>p[0]&&player.x<p[0]+p[2]&&(!player.ground||p[1]<FLOOR)){player.y=p[1]-player.h;player.vy=0;player.ground=true;player.jumps=0}}for(const p of movePlatforms){if(oldBottom<=p.y+12&&bottom>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.ground=true;player.jumps=0}}}
 if(player.y>H+70){hurt();return}
 for(const b of bonusItems){if(!b.taken&&Math.abs(player.x+23-b.x)<30&&Math.abs(player.y+23-b.y)<35)collectBonus(b)}
 for(const c of coins){if(c.taken)continue;const dx=player.x+23-c.x,dy=player.y+23-c.y;if(dx*dx+dy*dy<1100){c.taken=true;coinCombo=frame-lastCoinFrame<115?coinCombo+1:1;lastCoinFrame=frame;score+=10+(coinCombo>=3?5:0);if(coinCombo===3)sfx('combo');if(score%100===0)shieldCharge=Math.min(2,shieldCharge+1);sfx('coin');setHUD()}}
 for(const e of enemies){if(!e.alive)continue;e.x+=e.dir*(difficulty==='challenge'?1.45+li*.10:.85)*dt;if(Math.abs(e.x-e.origin)>42)e.dir*=-1;if(hit(player,e)){if(player.vy>1&&oldBottom<=e.y+15){e.alive=false;player.vy=-9;score+=20;sfx('stomp');setHUD()}else hurt()}}
 sparkles=sparkles.filter(p=>p.life>0);for(const p of sparkles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
 camera+=((Math.min(WORLD-W,Math.max(0,player.x-265)))-camera)*Math.min(.2,dt*.12);
 if(player.x>=WORLD-85){const spent=elapsed()-levelStarted;score+=Math.max(0,Math.round((difficulty==='challenge'?115:80)-spent))*3;locked=true;sfx('level');setHUD();quizScreen()}
 if(Math.floor(frame)%25===0)renderExtra()}

function drawCoin(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(255,255,255,.38)';ctx.beginPath();ctx.arc(2,3,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd65f';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff7c5';ctx.lineWidth=2.3;ctx.stroke();ctx.fillStyle='#fff2a4';ctx.beginPath();ctx.arc(-4,-4,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb347';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('C',0,5);ctx.restore()}
function drawCuteEnemy(e,pal){const x=e.x+18,y=e.y+28;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.10)';ctx.beginPath();ctx.ellipse(0,18,18,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=pal.enemy;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.fillStyle=pal.enemy2;ctx.beginPath();ctx.arc(-5,-5,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#243748';ctx.beginPath();ctx.arc(-6,-2,2.2,0,Math.PI*2);ctx.arc(6,-2,2.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#243748';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,4,5,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(-9,-8,3.3,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawCapyPlayer(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(21,47,20,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9e6c47';ctx.beginPath();ctx.roundRect(3,16,38,29,14);ctx.fill();ctx.fillStyle='#bb8458';ctx.beginPath();ctx.roundRect(11,3,30,26,12);ctx.fill();ctx.fillStyle='#8f5d38';ctx.beginPath();ctx.roundRect(13,-4,8,12,5);ctx.roundRect(27,-5,9,13,5);ctx.fill();ctx.fillStyle='#f0c6aa';ctx.beginPath();ctx.ellipse(31,18,8,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263648';ctx.beginPath();ctx.arc(32,14,2.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(38,22,1.7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8f5d38';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(26,21);ctx.lineTo(36,18);ctx.stroke();ctx.fillStyle='#f28ca8';ctx.beginPath();ctx.arc(15,24,3.6,0,Math.PI*2);ctx.arc(26,24,3.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5ccf72';ctx.beginPath();ctx.roundRect(10,27,24,8,4);ctx.fill();ctx.fillStyle='#fff6d7';ctx.beginPath();ctx.arc(30,30,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#6f4c32';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(12,43);ctx.lineTo(16,49);ctx.moveTo(29,43);ctx.lineTo(33,49);ctx.stroke();if(dashFrames>0){ctx.fillStyle='rgba(255,244,145,.65)';ctx.beginPath();ctx.ellipse(21-dashDir*22,26,28,12,0,0,Math.PI*2);ctx.fill()}if(shieldTime>0){ctx.strokeStyle='rgba(117,219,255,.95)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(22,24,34,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function drawGroundTile(x,pal){ctx.fillStyle=pal.dirt;ctx.fillRect(x,FLOOR+6,25,H-FLOOR);ctx.fillStyle=pal.dirt2;ctx.fillRect(x,FLOOR+25,25,H-FLOOR);ctx.fillStyle=pal.grass;ctx.fillRect(x,FLOOR,25,10);ctx.fillStyle=pal.grass2;ctx.fillRect(x,FLOOR,25,4)}
function drawPlatform(px,py,pw,pal,topColor){ctx.fillStyle=pal.plat;ctx.beginPath();ctx.roundRect(px,py,pw,18,7);ctx.fill();ctx.fillStyle=topColor||pal.platTop;ctx.beginPath();ctx.roundRect(px,py,pw,8,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(px+8,py+4,Math.max(20,pw*.3),2)}

function draw(){
 const bg=backgrounds[li];
 if(bg.complete&&bg.naturalWidth){
   // slow parallax pan while keeping the full canvas covered
   const scale=Math.max(W/bg.width,H/bg.height)*1.14;
   const bw=bg.width*scale,bh=bg.height*scale;
   const slack=bw-W,offset=slack>0?(camera/(WORLD-W))*slack:0;
   ctx.drawImage(bg,-offset,-(bh-H)*.26,bw,bh);
   ctx.fillStyle='rgba(246,251,252,.12)';ctx.fillRect(0,0,W,H);
 }else{
   ctx.fillStyle=levels[li].sky;ctx.fillRect(0,0,W,H);
 }
 ctx.save();ctx.translate(-camera,0);
 const pal=levelPalettes[li]||levelPalettes[0];
 for(let x=0;x<WORLD;x+=25){if(!onGround(x+12))continue;drawGroundTile(x,pal)}
 for(const gap of designs[li].gaps){ctx.fillStyle=pal.gap;ctx.fillRect(gap[0],FLOOR,gap[1]-gap[0],H-FLOOR);for(let x=gap[0]+15;x<gap[1]-10;x+=30){ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.arc(x,FLOOR+18+Math.sin((frame+x)*.08)*2,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x,FLOOR+18+Math.sin((frame+x)*.08)*2,11,0,Math.PI);ctx.stroke()}}
 for(const p of designs[li].platforms){drawPlatform(p[0],p[1],p[2],pal,pal.platTop)}
 for(const p of movePlatforms){drawPlatform(p.x,p.y,p.w,{plat:'#8b73bf',platTop:'#d4c5fb'},'#d4c5fb')}
 for(let x=210;x<WORLD-60;x+=310){if(onGround(x))emoji(levels[li].icon,x,FLOOR-104,41)}
 for(const b of bonusItems){if(!b.taken){const by=b.y+6;ctx.save();ctx.translate(b.x,by);ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();emoji(b.type==='magnet'?'🧲':b.type==='boost'?'⚡':'🛡️',0,10,28);ctx.restore()}}
 for(const c of coins){if(c.taken)continue;drawCoin(c.x,c.y)}
 const xx=safeCheckpoint();ctx.fillStyle=cpActive?'#5bc981':'#fff1cf';ctx.fillRect(xx,FLOOR-92,5,92);emoji(cpActive?'✅':'🚩',xx+20,FLOOR-91,32)
 for(const p of sparkles){ctx.globalAlpha=Math.max(0,p.life/22);emoji('✨',p.x,p.y,16)}ctx.globalAlpha=1;
 for(const e of enemies)if(e.alive)drawCuteEnemy(e,pal);
 ctx.fillStyle='#ffffffc0';ctx.beginPath();ctx.roundRect(WORLD-86,255,32,78,12);ctx.fill();ctx.fillStyle=pal.flag;ctx.beginPath();ctx.roundRect(WORLD-54,263,42,24,8);ctx.fill();ctx.strokeStyle='#c9982c';ctx.stroke();ctx.fillStyle='#6d5125';ctx.font='bold 12px sans-serif';ctx.fillText('GO',WORLD-33,280);
 if(player&&(!player.inv||Math.floor(frame/6)%2===0)){const x=player.x,y=player.y;drawCapyPlayer(x,y)}ctx.restore()}
function quizScreen(){clearPanel();const lv=levels[li];panel.append(el('p',`${lv.icon} ภารกิจสำเร็จ`,'eyebrow'),el('h2',`ผ่านด่าน ${li+1}: ${lv.name}`),el('p',lv.lesson),el('p',`🧠 ${lv.question}`));const feedback=el('p','','feedback');lv.options.forEach((answer,i)=>{const b=button(`${i+1}. ${answer}`,()=>{if(i!==lv.correct){sfx('wrong');feedback.textContent='ยังไม่ถูก ลองใหม่อีกครั้ง';return}sfx('correct');feedback.textContent='✅ ถูกต้อง!';feedback.style.color='#267348';panel.querySelectorAll('.answer').forEach(v=>v.disabled=true);panel.append(button(li===5?'✨ ค้นหาสาขาที่สนใจ':'➡️ ไปด่านต่อไป',()=>{if(li===5){interestScreen()}else{li++;prepareLevel()}},'btn primary'))},'btn answer');panel.append(b)});panel.append(feedback)}
function interestScreen(){clearPanel();panel.append(el('p','🎓 ภารกิจสุดท้าย','eyebrow'),el('h2','คุณอยากเป็นฮีโร่แบบไหน?'),el('p','เลือกสิ่งที่คุณสนใจจริง ๆ ผลนี้ใช้เพื่อแนะนำสาขาวิชา ไม่ใช่การตัดสินว่าคุณเหมาะหรือไม่เหมาะกับสาขาใด'));panel.append(button('🌏 ชอบแก้ปัญหาชุมชน น้ำท่วม สิ่งแวดล้อม และแผนที่',()=>resultScreen('social')));panel.append(button('🏯 ชอบวัฒนธรรม ประเพณี ภูมิปัญญา และแหล่งท่องเที่ยว',()=>resultScreen('culture')));panel.append(button('💚 สนใจทั้งสองด้าน',()=>resultScreen('both')))}
function resultScreen(type){sfx('finish');if(!practiceContinue)submitResult('completed');clearPanel();const title=type==='social'?'การจัดการภูมิสังคม':type==='culture'?'การจัดการภูมิวัฒนธรรม':'ทั้งสองสาขาวิชา';const detail=type==='social'?'เรียนรู้การวิเคราะห์พื้นที่ ความสัมพันธ์คนกับสิ่งแวดล้อม และการทำงานกับชุมชน':type==='culture'?'เรียนรู้มรดกวัฒนธรรม ภูมิปัญญา อัตลักษณ์ และการจัดการพื้นที่วัฒนธรรม':'ทั้งการจัดการภูมิสังคมและการจัดการภูมิวัฒนธรรมมีแนวทางเชื่อมโยงคน พื้นที่ และการพัฒนาที่ยั่งยืน';panel.append(el('p','🎉 ยินดีด้วย! เล่นครบ 6 ด่าน','eyebrow'),el('h2','ค้นพบแนวทางที่คุณสนใจ'),el('p',`คะแนนมาตรฐาน ${capyScore1000(6,score)} / 1,000 คะแนน (คะแนนสะสมเดิม ${score})`));const box=el('div','','result');box.append(el('span','สาขาที่คุณสนใจ','pill'),el('h2',title),el('p',detail));panel.append(box,el('p','🎓 เรียนรู้เพิ่มเติมได้ที่วิทยาลัยโพธิวิชชาลัย มหาวิทยาลัยศรีนครินทรวิโรฒ'));panel.append(el('p','ตรวจสอบชื่อหลักสูตร รายละเอียดวิชา และข้อมูลรับสมัครจากช่องทางอย่างเป็นทางการของวิทยาลัยก่อนตัดสินใจ','muted'));panel.append(el('p',SHEETS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/')?'ระบบได้ส่งคำขอบันทึกผล กรุณาตรวจสอบรายการใน Google Sheets':'ยังไม่ได้เชื่อม Google Sheets จึงยังไม่บันทึกคะแนนลงฐานข้อมูล','muted'));panel.append(button('🎮 เล่นใหม่',newGame,'btn primary'));panel.append(button('📋 คัดลอกผลของฉัน',()=>{const msg=`ฉันเล่น Capy Hero ครบ 6 ด่าน ได้ ${capyScore1000(6,score)}/1000 คะแนน (สะสมเดิม ${score}) และสนใจ: ${title} 🐹`;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(msg).then(()=>alert('คัดลอกผลสำเร็จ')).catch(()=>prompt('คัดลอกข้อความนี้',msg))}else prompt('คัดลอกข้อความนี้',msg)}))}
function continueCheckpoint(){
 if(continueUsed>=2)return;
 continueUsed++;practiceContinue=true;
 score=Math.max(0,score-100);lives=2;
 // Keep consumed coins and defeated enemies. No repeat-farming after respawn.
 if(!cpActive){cpX=60;}else{cpX=safeCheckpoint();}
 respawn();player.inv=160;locked=false;overlay.classList.add('hidden');
 keys.left=false;keys.right=false;setHUD();renderExtra();
}
function endScreen(win){
 clearPanel();
 panel.append(el('h2',win?'🎉 สำเร็จ':'💔 พลังหมดแล้ว'));
 panel.append(el('p',`คะแนนมาตรฐาน ${capyScore1000(li,score)} / 1,000 คะแนน • ผ่าน ${li}/6 ด่าน • คะแนนสะสมเดิม ${score}`));
 if(practiceContinue)panel.append(el('p','โหมดเล่นต่อเพื่อฝึกฝน: คะแนนรอบนี้จะไม่ส่งเข้าอันดับแข่งขัน','muted'));
 if(continueUsed<2){panel.append(button(`⚡ เล่นต่อจากจุดพัก (หัก 100 คะแนน) • เหลือ ${2-continueUsed} ครั้ง`,continueCheckpoint,'btn primary'));}
 panel.append(button('↻ เริ่มเกมใหม่',()=>{if(!practiceContinue)submitResult('gameover');newGame()},'btn'));
 const status=el('p','','muted');status.setAttribute('aria-live','polite');
 const finish=button('🏁 จบเกมและบันทึกคะแนน',async()=>{
    if(practiceContinue){status.textContent='รอบนี้เป็นโหมดฝึกฝนหลังเล่นต่อ จึงไม่ส่งคะแนนเข้าอันดับแข่งขัน';finish.disabled=true;return;}
    finish.disabled=true;status.textContent='กำลังส่งข้อมูลคะแนน...';
    await submitResult('gameover');
    status.textContent=finalStatus||'ยังไม่สามารถยืนยันผลการส่ง กรุณาตรวจสอบ Google Sheets';
 },'btn');
 panel.append(finish,status);
}

let last=0;function loop(t){const dt=Math.min(2,(t-last)/16.667||1);last=t;update(dt);draw();requestAnimationFrame(loop)}
function bind(id,key){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('pressed');if(key==='jump')jump();else keys[key]=true});function release(e){e.preventDefault();b.classList.remove('pressed');if(key!=='jump')keys[key]=false}b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',()=>{b.classList.remove('pressed');if(key!=='jump')keys[key]=false})}bind('left','left');bind('right','right');bind('jump','jump');$('dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});$('skill').addEventListener('click',useShield);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','ArrowUp','KeyA','KeyD','KeyW','KeyX'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(['Space','ArrowUp','KeyW'].includes(e.code)&&!e.repeat)jump();if(e.code==='KeyZ'&&!e.repeat)dash();if(e.code==='KeyX'&&!e.repeat)useShield()});window.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false});window.addEventListener('blur',()=>{keys.left=false;keys.right=false});$('restart').onclick=()=>{if(confirm('ต้องการเริ่มเกมใหม่?'))newGame()};$('how').onclick=startScreen;
prepareLevel();locked=true;startScreen();requestAnimationFrame(loop);
</script>
